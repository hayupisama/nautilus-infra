# Environnement local Nautilus : PostgreSQL/PostGIS + Keycloak (realm "nautilus" importe au demarrage) + OSRM.
# Usage : voir local/README.md. Les variables viennent de local/.env (copie REMPLIE de .env.example) :
# aucune valeur sensible n'est ecrite ici ni dans le depot.
name: nautilus-local

services:
  postgres:
    # Meme image que les Dev Services de nautilus-api (epinglee par digest)
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?remplir .env (voir .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?remplir .env (voir .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?remplir .env (voir .env.example)}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?remplir .env (voir .env.example)}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?remplir .env (voir .env.example)}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?remplir .env (voir .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Monter le fichier seul : monter le dossier masquerait le script PostGIS de l'image (10_postgis.sh)
      - ./postgres/init/20-keycloak-db.sh:/docker-entrypoint-initdb.d/20-keycloak-db.sh:ro
    healthcheck:
      # En TCP (-h 127.0.0.1) : le serveur temporaire de l'init n'ecoute que sur la socket Unix,
      # donc le controle ne passe qu'une fois l'init terminee ; la base Keycloak doit aussi repondre.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${KEYCLOAK_DB_NAME}\" -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:?remplir .env (voir .env.example)}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?remplir .env (voir .env.example)}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?remplir .env (voir .env.example)}
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?remplir .env (voir .env.example)}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?remplir .env (voir .env.example)}
      # Substitue a l'import dans nautilus-realm.json (credentials des comptes de test)
      KEYCLOAK_TEST_USERS_PASSWORD: ${KEYCLOAK_TEST_USERS_PASSWORD:?remplir .env (voir .env.example)}
      # Heap bornee pour tenir dans la limite memoire du conteneur
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # L'image n'a ni curl ni wget : requete HTTP brute sur le port de management.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # --- OSRM (itineraires, extrait OSM Pays de la Loire) ---
  # Chaine : osrm-download (une fois) -> osrm-prepare (une fois) -> osrm (serveur). Les deux premiers
  # services sont ponctuels et relancables : ils ne refont rien si les donnees du volume sont a jour.
  osrm-download:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    # root : le volume nomme est cree avec le proprietaire root
    user: "0:0"
    entrypoint: ["sh", "/osrm-scripts/download.sh"]
    environment:
      # Extrait date et conserve durablement par Geofabrik (fichiers du 1er janvier) : donnees reproductibles.
      OSRM_PBF_URL: ${OSRM_PBF_URL:-https://download.geofabrik.de/europe/france/pays-de-la-loire/pays-de-la-loire-260101.osm.pbf}
      OSRM_PBF_MD5: ${OSRM_PBF_MD5:-aa15a608a2a96ab7bd0474c1f92de933}
    volumes:
      - ${OSRM_DATA_DIR:-osrm-data}:/data
      - ./osrm:/osrm-scripts:ro
    deploy:
      resources:
        limits:
          memory: 128m
    restart: "no"

  osrm-prepare:
    image: &osrm-image ghcr.io/project-osrm/osrm-backend:v26.11.0-debian@sha256:e1929ae2818226284d7ef007329098a30851c11528ab3712bc9c8d68da78278b
    entrypoint: ["sh", "/osrm-scripts/prepare.sh"]
    environment:
      OSRM_PROFILE: car
    volumes:
      - ${OSRM_DATA_DIR:-osrm-data}:/data
      - ./osrm:/osrm-scripts:ro
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          # Pic de l'extraction (ponctuel, premier demarrage seulement) ; voir README
          memory: ${OSRM_PREPARE_MEMORY:-3g}
    restart: "no"

  osrm:
    image: *osrm-image
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "1000", "/data/region.osrm"]
    ports:
      - "127.0.0.1:${OSRM_PORT:-5000}:5000"
    volumes:
      - ${OSRM_DATA_DIR:-osrm-data}:/data:ro
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    healthcheck:
      # Pas de curl dans l'image : requete HTTP brute (point proche de la gare de Nantes).
      # bash explicite : /bin/sh (dash) ne connait pas /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /nearest/v1/driving/-1.5418,47.2172 HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"code\":\"Ok\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${OSRM_MEMORY:-1g}
    restart: unless-stopped

volumes:
  postgres-data:
  osrm-data:
